<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FitBuddy | AI Fitness Plan</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
<main class="container">
  <section class="hero">
    <span class="badge">AI FITNESS PLANNER</span>
    <h1>FitBuddy</h1>
    <p>Generate a personalized 7-day workout plan and a practical nutrition tip.</p>
  </section>

  <section class="card">
    {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
    <form action="/generate-workout" method="post" class="form-grid">
      <label>Name
        <input name="username" required maxlength="120" placeholder="Your name">
      </label>
      <label>User ID
        <input name="user_id" required maxlength="80" placeholder="e.g. FB001">
      </label>
      <label>Age
        <input type="number" name="age" min="13" max="100" required>
      </label>
      <label>Weight (kg)
        <input type="number" name="weight" min="20" max="500" step="0.1" required>
      </label>
      <label>Fitness Goal
        <select name="goal" required>
          <option value="weight loss">Weight loss</option>
          <option value="muscle gain">Muscle gain</option>
          <option value="general wellness">General wellness</option>
          <option value="flexibility">Flexibility</option>
        </select>
      </label>
      <label>Workout Intensity
        <select name="intensity" required>
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>
      </label>
      <button type="submit" class="button primary full">Generate Plan</button>
    </form>
  </section>

  <p class="fine-print">General wellness guidance only. Stop exercise if you experience pain or concerning symptoms.</p>
</main>
</body>
</html>
