<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FitBuddy | Admin</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
<main class="container narrow">
  <section class="card">
    <h1>Admin Dashboard</h1>
    <p class="muted">Enter the configured admin password.</p>
    {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
    <form action="/view-all-users" method="get">
      <input type="password" name="admin_password" required placeholder="Admin password">
      <button class="button primary full" type="submit">Open Dashboard</button>
    </form>
  </section>
</main>
</body>
</html>
